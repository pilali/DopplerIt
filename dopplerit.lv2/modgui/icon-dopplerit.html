<div class="mod-pedal dopplerit{{{cns}}}">
    <div mod-role="drag-handle" class="mod-drag-handle"></div>

    <div class="dp-header">
        <svg class="dp-waves" viewBox="0 0 320 104" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
                <linearGradient id="dpwave{{{cns}}}" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0" stop-color="#40a0ff"/>
                    <stop offset="1" stop-color="#ff5448"/>
                </linearGradient>
                <linearGradient id="dpbeamb{{{cns}}}" x1="1" x2="0" y1="0" y2="0">
                    <stop offset="0" stop-color="#40a0ff" stop-opacity="0.55"/>
                    <stop offset="1" stop-color="#40a0ff" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="dpbeamr{{{cns}}}" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0" stop-color="#ff5448" stop-opacity="0.55"/>
                    <stop offset="1" stop-color="#ff5448" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="dpdome{{{cns}}}" x1="0" x2="1" y1="0" y2="0">
                    <stop offset="0" stop-color="#7fc0ff"/>
                    <stop offset="0.48" stop-color="#2f7fe0"/>
                    <stop offset="0.52" stop-color="#e0443a"/>
                    <stop offset="1" stop-color="#ff8a7f"/>
                </linearGradient>
                <radialGradient id="dpglow{{{cns}}}">
                    <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
                    <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
                </radialGradient>
            </defs>
            <g fill="none" stroke="url(#dpwave{{{cns}}})" stroke-width="2">
                <circle cx="212" cy="58" r="28" opacity="0.70"/>
                <circle cx="190" cy="58" r="54" opacity="0.48"/>
                <circle cx="166" cy="58" r="82" opacity="0.30"/>
                <circle cx="140" cy="58" r="112" opacity="0.18"/>
                <circle cx="112" cy="58" r="144" opacity="0.10"/>
            </g>
            <polygon points="246,56 150,18 150,92" fill="url(#dpbeamb{{{cns}}})"/>
            <polygon points="262,56 320,26 320,86" fill="url(#dpbeamr{{{cns}}})"/>
            <circle cx="254" cy="56" r="30" fill="url(#dpglow{{{cns}}})"/>
            <path d="M239 70 L239 58 A15 17 0 0 1 269 58 L269 70 Z" fill="url(#dpdome{{{cns}}})" stroke="#0b0d11" stroke-width="1.5"/>
            <path d="M244 58 A10 12 0 0 1 252 46" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="2.5" stroke-linecap="round"/>
            <rect x="234" y="70" width="40" height="9" rx="2" fill="#3a404c" stroke="#0b0d11" stroke-width="1.5"/>
            <rect x="230" y="78" width="48" height="5" rx="2" fill="#262a32"/>
        </svg>
        <div class="mod-plugin-brand dp-brand">pilali</div>
        <div class="mod-plugin-name dp-title">Doppler<span>It</span></div>
    </div>

    <div class="mod-control-group dp-output" title="Output: Mono / Stereo">
        <div class="dp-select dp-select-small" mod-role="input-control-port" mod-port-symbol="output" mod-widget="custom-select">
            <div class="dp-opt dp-opt-mono" mod-role="enumeration-option" mod-port-value="0">Mono</div>
            <div class="dp-opt dp-opt-stereo" mod-role="enumeration-option" mod-port-value="1">Stereo</div>
        </div>
    </div>

    <div class="mod-control-group dp-mode" title="Mode: arrival, full pass-by or departure">
        <div class="dp-select" mod-role="input-control-port" mod-port-symbol="mode" mod-widget="custom-select">
            <div class="dp-opt dp-opt-approach" mod-role="enumeration-option" mod-port-value="0">Approach</div>
            <div class="dp-opt dp-opt-passby" mod-role="enumeration-option" mod-port-value="2">Pass-by</div>
            <div class="dp-opt dp-opt-recede" mod-role="enumeration-option" mod-port-value="1">Recede</div>
        </div>
    </div>

    <div class="mod-control-group dp-knob dp-col1 dp-row1" title="Time">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="time"></div>
        <span class="dp-knob-title">Time</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="time"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col2 dp-row1" title="Speed">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="speed"></div>
        <span class="dp-knob-title">Speed</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="speed"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col3 dp-row1" title="Depth">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="depth"></div>
        <span class="dp-knob-title">Depth</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="depth"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col1 dp-row2" title="Shape">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="shape"></div>
        <span class="dp-knob-title">Shape</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="shape"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col2 dp-row2" title="Period">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="period"></div>
        <span class="dp-knob-title">Period</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="period"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col3 dp-row2" title="Feedback">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="feedback"></div>
        <span class="dp-knob-title">Feedback</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="feedback"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col12 dp-row3" title="Tone">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="tone"></div>
        <span class="dp-knob-title">Tone</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="tone"></span>
    </div>
    <div class="mod-control-group dp-knob dp-col23 dp-row3" title="Dry/Wet">
        <div class="dp-knob-image" mod-role="input-control-port" mod-port-symbol="mix"></div>
        <span class="dp-knob-title">Dry/Wet</span>
        <span class="dp-knob-value" mod-role="input-control-value" mod-port-symbol="mix"></span>
    </div>

    <div class="mod-light dp-led on" mod-role="bypass-light"></div>
    <div class="mod-footswitch dp-footswitch" mod-role="bypass"></div>

    <div class="mod-pedal-input">
        {{#effect.ports.audio.input}}
        <div class="mod-input mod-input-disconnected" title="{{name}}" mod-role="input-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-input-image"></div>
        </div>
        {{/effect.ports.audio.input}}
    </div>
    <div class="mod-pedal-output">
        {{#effect.ports.audio.output}}
        <div class="mod-output mod-output-disconnected" title="{{name}}" mod-role="output-audio-port" mod-port-symbol="{{symbol}}">
            <div class="mod-pedal-output-image"></div>
        </div>
        {{/effect.ports.audio.output}}
    </div>
</div>
