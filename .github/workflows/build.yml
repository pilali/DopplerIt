name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lv2:
    name: LV2 (Linux, tests, ARM cross-builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lv2-dev lilv-utils g++-aarch64-linux-gnu g++-arm-linux-gnueabihf
      - name: Build and test
        run: |
          make NOOPT=true
          make test
          LV2_PATH=$PWD/build lv2info https://github.com/pilali/dopplerit > /dev/null
      - name: Cross-compile (Pi 5, Dwarf / Duo X, Duo)
        run: |
          FLAGS="-O3 -std=c++11 -fPIC -fvisibility=hidden -ffast-math -fno-finite-math-only -Wall -Wextra -Werror -Wno-unused-parameter -shared -Wl,--no-undefined"
          aarch64-linux-gnu-g++ -mcpu=cortex-a76 $FLAGS src/dopplerit.cpp -o /tmp/a76.so
          aarch64-linux-gnu-g++ -mcpu=cortex-a53 $FLAGS src/dopplerit.cpp -o /tmp/a53.so
          arm-linux-gnueabihf-g++ -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard $FLAGS src/dopplerit.cpp -o /tmp/a7.so
      - uses: actions/upload-artifact@v4
        with:
          name: DopplerIt-LV2-x86_64-linux
          path: build/dopplerit.lv2

  juce:
    name: JUCE ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (VST3)
            os: ubuntu-22.04
            artifact: DopplerIt-VST3-Linux-x86_64
            pluginval: pluginval_Linux.zip
          - name: Windows (VST3)
            os: windows-latest
            artifact: DopplerIt-VST3-Windows-x64
            pluginval: pluginval_Windows.zip
          - name: macOS universal (VST3 + AU)
            os: macos-latest
            artifact: DopplerIt-macOS-universal
            pluginval: pluginval_macOS.zip
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev xvfb

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -S juce -B build-juce -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -S juce -B build-juce -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build-juce --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          ART=build-juce/DopplerIt_artefacts/Release
          mkdir -p dist
          cp -R "$ART/VST3/DopplerIt.vst3" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R "$ART/AU/DopplerIt.component" dist/
            # ad-hoc signature (required for Apple Silicon); use a Developer ID for distribution
            codesign --force --deep --sign - dist/DopplerIt.vst3 dist/DopplerIt.component
            for b in dist/DopplerIt.vst3/Contents/MacOS/DopplerIt dist/DopplerIt.component/Contents/MacOS/DopplerIt; do
              lipo -info "$b"
              for arch in x86_64 arm64; do
                echo "$arch:"
                otool -arch $arch -l "$b" | grep -A4 -E "LC_VERSION_MIN_MACOSX|LC_BUILD_VERSION" | grep -E "cmd|version|minos"
              done
            done
          fi
          cp README.md LICENSE dist/
          cp juce/Assets/fonts/OFL.txt dist/OFL-CooperHewitt.txt

      - name: pluginval
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -oq pluginval.zip
          case "$RUNNER_OS" in
            Linux)   PV="xvfb-run -a ./pluginval" ;;
            Windows) PV="./pluginval.exe" ;;
            macOS)   PV="./pluginval.app/Contents/MacOS/pluginval" ;;
          esac
          $PV --strictness-level 10 --validate-in-process --timeout-ms 900000 dist/DopplerIt.vst3

      - name: auval (Audio Unit)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/DopplerIt.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i Dplr || true
          auval -strict -v aufx Dplr Pila
          arch -x86_64 auval -v aufx Dplr Pila

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lv2, juce]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip
        run: |
          cd artifacts
          for d in */; do (cd "$d" && zip -qry "../${d%/}.zip" .); done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
